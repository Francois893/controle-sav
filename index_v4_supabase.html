<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Contrôle SAV Atelier</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102b40;background:#f2f5f7;--blue:#0b5d8c;--green:#17864d;--yellow:#d69b17;--red:#c83c35}
*{box-sizing:border-box}body{margin:0}.app{max-width:860px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#123d59,#0b6697);color:#fff;padding:20px;border-radius:18px}.hero h1{margin:0;font-size:25px}.hero p{margin:5px 0 0;opacity:.85}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000c}
h2{font-size:18px;margin:3px 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:700;display:block;margin:10px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #cbd5dc;border-radius:10px;background:#fff}.btn{width:100%;border:0;border-radius:11px;padding:14px;font-weight:750;font-size:16px}.primary{background:var(--blue);color:#fff}.light{background:#e8f1f6;color:#16415b}
.hidden{display:none}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{font-size:12px;background:#e8f1f6;padding:6px 9px;border-radius:99px}.progress{height:9px;background:#e5ebef;border-radius:9px;overflow:hidden;margin-top:9px}.bar{height:100%;background:var(--green);width:0}
.group{margin-top:18px}.group-title{display:flex;justify-content:space-between;align-items:center;margin:0 3px 7px;font-weight:800}.point{background:#fff;border-radius:14px;padding:14px;margin:8px 0;border:1px solid #dce4e9}.point-name{font-weight:750;margin-bottom:10px}.states{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.state{border:1px solid #cbd5dc;background:#fff;border-radius:9px;padding:10px 3px;font-size:12px}.state.on.ok{background:var(--green);color:#fff}.state.on.watch{background:var(--yellow);color:#fff}.state.on.bad{background:var(--red);color:#fff}.state.on.na{background:#68747d;color:#fff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo-tools{margin-top:9px}.photo-btn{display:inline-block;background:#e8f1f6;color:#16415b;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:750;cursor:pointer}.photo-btn input{display:none}.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.thumb{position:relative}.thumb img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid #ccd7dd}.thumb button{position:absolute;right:-5px;top:-5px;border:0;background:#c83c35;color:#fff;border-radius:50%;width:22px;height:22px}.print-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:5px 0 10px}.print-photo{border:1px solid #777;padding:4px;break-inside:avoid}.print-photo img{width:100%;height:45mm;object-fit:contain;display:block}.print-photo div{font-size:9px;margin-top:3px}.arrival-head{display:grid;grid-template-columns:1fr 55mm;gap:6mm}.arrival-head img{width:55mm;height:42mm;object-fit:contain}.print{display:none}
@media(max-width:560px){.grid,.fields{grid-template-columns:1fr}.states{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff}.screen{display:none!important}.print{display:block!important;color:#000;font-family:Arial,sans-serif}.app{max-width:none;padding:0}.print h1{text-align:center;font-size:19px;margin:0 0 4px}.print .meta{font-size:11px;border:1px solid #555;padding:7px;margin:8px 0}.print h2{font-size:13px;background:#173f58;color:#fff;padding:6px;margin:10px 0 0}.print table{width:100%;border-collapse:collapse;font-size:9px}.print th,.print td{border:1px solid #555;padding:4px}.print th{background:#e9eef1}.print .cat td{background:#d9e0e4;font-weight:bold}.box{text-align:center;width:5%}.sign{margin-top:10px;border:1px solid #555;padding:8px;font-size:10px}.pagebreak{break-before:page;page-break-before:always}@page{size:A4;margin:8mm}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="app">
<div class="screen"><div class="hero"><h1>🔧 Contrôle SAV Atelier</h1><p>Diagnostic réception • Validation avant retour client</p></div>
<section id="setup" class="card"><h2>Nouvelle fiche</h2><div class="grid"><div><label>Client</label><input id="client" placeholder="Nom du client"></div><div><label>N° série</label><input id="serial" placeholder="Numéro de série"></div><div><label>Gamme</label><select id="machine"><option>Micron</option><option>Micron+</option><option>B4</option><option>StarBi</option></select></div><div><label>Système</label><select id="system"><option value="piston">Piston</option><option value="gear">Engrenage</option></select></div><div><label>Type / capacité de bac</label><select id="tank"><option>5 L</option><option>10 L</option><option>20 L</option><option>Autre</option></select></div><div><label>Technicien</label><input id="tech" placeholder="Nom"></div></div><label>Motif du retour</label><textarea id="reason" rows="2"></textarea>
<label>📷 Photo de la machine à l’arrivée</label>
<input id="arrivalFile" type="file" accept="image/*" capture="environment" onchange="setArrival(this.files[0])">
<img id="arrivalPreview" style="display:none;width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:8px"><button class="btn primary" style="margin-top:14px" onclick="start()">Générer la fiche</button></section>
<section id="work" class="hidden"><div class="card"><div class="topline"><b id="title"></b><span class="pill" id="counter"></span></div><div class="progress"><div id="bar" class="bar"></div></div></div><div id="mobile"></div><div class="card actions">
<button class="btn primary" onclick="saveToSupabase()">💾 Enregistrer</button>
<button class="btn light" onclick="paper();window.print()">🖨️ Imprimer / PDF</button>
<button class="btn light" onclick="sendMail()">✉️ Envoyer par mail</button>
<button class="btn light" onclick="showHistory()">📚 Historique</button>
<button class="btn primary" onclick="location.reload()">＋ Nouvelle fiche</button>
</div><div id="history" class="card hidden"><h2>Historique des fiches</h2><input id="historySearch" placeholder="Client, série…" oninput="filterHistory()"><div id="historyList"></div></div></section></div>
<section id="paper" class="print"></section></main>
<script>
const SB_URL="https://ocnksvipobuongjvzhne.supabase.co";
const SB_KEY="sb_publishable_icxMkaFJj5GCsmFVOGnwTw_RG97_RYy";
const sb=supabase.createClient(SB_URL,SB_KEY);
let arrivalBlob=null, arrivalPrintUrl="", historyRows=[];
const common={
"VUE ENSEMBLE":["CARTER","FEEDER"],
"ELECTRIQUE":["CONNECTION ELECTRIQUE","SORTIE ELECTRIQUE","CAPTEUR","BOBINE","BALISE"],
"APPLICATEUR":["FONCTIONNEMENT","FIXATION","FUITE","CONNECTION / BORNIER / CONNECTEUR","ELECTROVANNE","SONDE / RESISTANCE","MODULE","RACCORD AIR","BUSE"],
"TUYAUX":["FONCTIONNEMENT","FUITE","CONNECTION","REVETEMENT"],
"PISTOLET":["FONCTIONNEMENT","SONDE / RESISTANCE","CONNECTION / BORNIER","FUITE / COLLE","CARCASSE","SECURITE","BUSE"]};
const piston=["FILTRE","VERIN","ELECTROVANNE","VANNE DEPRESSURISATION","VALVE","RACCORD","DETENDEUR / MANO","AXE DE POMPE","ISOLANT","DISTRIBUTEUR","JOINT CUVE"];
const gear=["FILTRE","ACCOUPLEMENT","FUITE / POMPE","BY PASS","VERIN NS","ISOLANT","DISTRIBUTEUR","JOINT CUVE"];
let status={}, photos={}, total=0; const $=s=>document.querySelector(s);
function groups(){let o={"VUE ENSEMBLE":common["VUE ENSEMBLE"]};o[system.value==="piston"?"SYSTEME PISTON":"SYSTEME ENGRENAGE"]=system.value==="piston"?piston:gear;["ELECTRIQUE","PISTOLET"].forEach(k=>o[k]=common[k]);return o}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function start(){setup.classList.add("hidden");work.classList.remove("hidden");title.textContent=machine.value+" • "+(system.value==="piston"?"Piston":"Engrenage")+" • "+tank.value;render()}
function render(){let h="",idx=0;total=Object.values(groups()).flat().length;for(const [g,items] of Object.entries(groups())){h+=`<div class="group"><div class="group-title"><span>${g}</span><span class="pill">${items.length} points</span></div>`;items.forEach(x=>{let i=idx++;h+=`<div class="point"><div class="point-name">${i+1}. ${x}</div><div class="states">${[["ok","✓ Bon état"],["watch","⚠ À surveiller"],["bad","✕ À remplacer"],["na","— N/A"]].map(a=>`<button class="state ${a[0]}" onclick="pick(${i},'${a[0]}',this)">${a[1]}</button>`).join("")}</div><div class="fields"><input id="v${i}" placeholder="Valeur relevée / unité" oninput="paper()"><input id="n${i}" placeholder="Commentaire / action" oninput="paper()"></div><div class="photo-tools"><label class="photo-btn">📷 Ajouter photo<input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(${i},this.files)"></label><div class="thumbs" id="ph${i}"></div></div></div>`});h+="</div>"}mobile.innerHTML=h;update()}
function addPhotos(i,files){photos[i]??=[];[...files].forEach(f=>{let r=new FileReader();r.onload=e=>{photos[i].push(e.target.result);drawPhotos(i);paper()};r.readAsDataURL(f)});}
function drawPhotos(i){let el=document.getElementById("ph"+i);if(!el)return;el.innerHTML=(photos[i]||[]).map((p,k)=>`<div class="thumb"><img src="${p}"><button onclick="removePhoto(${i},${k})">×</button></div>`).join("")}
function removePhoto(i,k){photos[i].splice(k,1);drawPhotos(i);paper()}

async function ensureLogin(){
  let {data:{session}}=await sb.auth.getSession();
  if(session)return true;
  let email=prompt("E-mail Supabase :"); if(!email)return false;
  let password=prompt("Mot de passe :"); if(!password)return false;
  let {error}=await sb.auth.signInWithPassword({email,password});
  if(error){alert("Connexion impossible : "+error.message);return false}
  return true;
}
function setArrival(file){
  if(!file)return;
  arrivalBlob=file;
  arrivalPrintUrl=URL.createObjectURL(file);
  arrivalPreview.src=arrivalPrintUrl; arrivalPreview.style.display="block"; paper();
}
async function ensureMachine(){
  let r=await sb.from("machines").select("id").eq("gamme",machine.value).eq("technologie",system.value).eq("type_bac",tank.value).limit(1);
  if(r.error)throw r.error;
  if(r.data.length)return r.data[0].id;
  r=await sb.from("machines").insert({gamme:machine.value,technologie:system.value,type_bac:tank.value}).select("id").single();
  if(r.error)throw r.error; return r.data.id;
}
async function uploadPhoto(blob,path){
  let r=await sb.storage.from("photos-sav").upload(path,blob,{upsert:true,contentType:blob.type||"image/jpeg"});
  if(r.error)throw r.error; return path;
}
async function saveToSupabase(){
  if(!await ensureLogin())return;
  try{
    let mid=await ensureMachine(), arrivalPath=null;
    if(arrivalBlob)arrivalPath=await uploadPhoto(arrivalBlob,"arrivees/"+Date.now()+"-"+(serial.value||"machine")+".jpg");
    let f=await sb.from("fiches_sav").insert({client:client.value,numero_serie:serial.value,machine_id:mid,motif:reason.value,photo_arrivee:arrivalPath,statut:"en_cours"}).select("id").single();
    if(f.error)throw f.error;
    let idx=0;
    for(const [cat,items] of Object.entries(groups())) for(const point of items){
      let c=await sb.from("controles").insert({fiche_id:f.data.id,categorie:cat,point,resultat:status[idx]||null,valeur_mesuree:document.getElementById("v"+idx)?.value||null,commentaire:document.getElementById("n"+idx)?.value||null,ordre:idx}).select("id").single();
      if(c.error)throw c.error;
      for(let k=0;k<(photos[idx]||[]).length;k++){
        let blob=await (await fetch(photos[idx][k])).blob();
        let path=await uploadPhoto(blob,`fiches/${f.data.id}/controle-${c.data.id}-${k}.jpg`);
        let pr=await sb.from("photos").insert({fiche_id:f.data.id,controle_id:c.data.id,fichier:path});
        if(pr.error)throw pr.error;
      }
      idx++;
    }
    alert("Fiche enregistrée dans Supabase ✓");
  }catch(e){console.error(e);alert("Erreur d’enregistrement : "+e.message)}
}
async function showHistory(){
  if(!await ensureLogin())return;
  let r=await sb.from("fiches_sav").select("id,client,numero_serie,date_creation,statut,machines(gamme,technologie,type_bac)").order("date_creation",{ascending:false});
  if(r.error){alert(r.error.message);return}
  historyRows=r.data||[]; history.classList.remove("hidden"); filterHistory(); history.scrollIntoView({behavior:"smooth"});
}
function filterHistory(){
  let q=(historySearch.value||"").toLowerCase();
  let rows=historyRows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  historyList.innerHTML=rows.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #ddd"><b>${esc(x.client||"Sans client")}</b> — ${esc(x.machines?.gamme||"")}<br><small>Série ${esc(x.numero_serie||"—")} • ${new Date(x.date_creation).toLocaleString("fr-FR")}</small></div>`).join("")||"<p>Aucune fiche.</p>";
}
function sendMail(){
  paper();
  let subject=encodeURIComponent(`Rapport SAV - ${client.value} - ${machine.value}`);
  let body=encodeURIComponent(`Bonjour,\n\nRapport SAV : ${machine.value}\nClient : ${client.value}\nN° série : ${serial.value}\n\nSur iPhone : utilisez d’abord Imprimer / PDF puis partagez le PDF en pièce jointe dans Mail.`);
  location.href=`mailto:?subject=${subject}&body=${body}`;
}

function pick(i,s,b){status[i]=s;b.parentElement.querySelectorAll(".state").forEach(x=>x.classList.remove("on"));b.classList.add("on");update()}
function update(){let n=Object.keys(status).length;counter.textContent=n+" / "+total;bar.style.width=(total?100*n/total:0)+"%";paper()}
function printPhotos(){let a=[];let idx=0;for(const [g,items] of Object.entries(groups()))items.forEach(x=>{(photos[idx]||[]).forEach((p,k)=>a.push(`<div class="print-photo"><img src="${p}"><div><b>${idx+1}. ${x}</b> — Photo ${k+1}</div></div>`));idx++});return a.length?`<h2>PHOTOS DU DIAGNOSTIC</h2><div class="print-photos">${a.join("")}</div>`:""}
function paper(){let rows="",idx=0;for(const [g,items] of Object.entries(groups())){rows+=`<tr class="cat"><td colspan="8">${g}</td></tr>`;items.forEach(x=>{let i=idx++,s=status[i]||"";rows+=`<tr><td>${i+1}</td><td>${x}</td><td class="box">${s==="ok"?"☒":"☐"}</td><td class="box">${s==="watch"?"☒":"☐"}</td><td class="box">${s==="bad"?"☒":"☐"}</td><td class="box">${s==="na"?"☒":"☐"}</td><td>${esc($("#v"+i)?.value||"")}</td><td>${esc($("#n"+i)?.value||"")}</td></tr>`})}
let final="",j=0;for(const [g,items] of Object.entries(groups())){final+=`<tr class="cat"><td colspan="7">${g}</td></tr>`;items.forEach(x=>final+=`<tr><td>${++j}</td><td>${x}</td><td>À définir</td><td></td><td class="box">☐</td><td class="box">☐</td><td></td></tr>`)}
paperEl.innerHTML=`<h1>FICHE DE CONTRÔLE SAV</h1><div class="arrival-head"><div class="meta"><b>${esc(machine.value)} — ${system.value==="piston"?"PISTON":"ENGRENAGE"} — BAC ${esc(tank.value)}</b><br>Client : ${esc(client.value)||"________________"} &nbsp;&nbsp; N° série : ${esc(serial.value)||"________________"}<br>Technicien : ${esc(tech.value)||"________________"} &nbsp;&nbsp; Date : ____ / ____ / ______<br>Motif : ${esc(reason.value)||"________________________________________"}</div>${arrivalPrintUrl?`<img src="${arrivalPrintUrl}">`:""}</div><h2>A — DIAGNOSTIC À RÉCEPTION</h2><table><tr><th>N°</th><th>Point de contrôle</th><th>OK</th><th>Surv.</th><th>Rempl.</th><th>N/A</th><th>Valeur</th><th>Commentaire / action</th></tr>${rows}</table>${printPhotos()}<div class="pagebreak"></div><h1>FICHE DE CONTRÔLE SAV</h1><h2>B — CONTRÔLE FINAL AVANT EXPÉDITION</h2><table><tr><th>N°</th><th>Test</th><th>Consigne</th><th>Valeur mesurée</th><th>OK</th><th>NOK</th><th>Commentaire</th></tr>${final}</table><div class="sign"><b>VALIDATION AVANT EXPÉDITION</b><br>☐ Machine nettoyée &nbsp; ☐ Capots remontés &nbsp; ☐ Aucun défaut actif &nbsp; ☐ Absence de fuite &nbsp; ☐ Accessoires présents<br><br>☐ MACHINE VALIDÉE &nbsp;&nbsp;&nbsp; Technicien : __________________ &nbsp;&nbsp; Date : ____ / ____ / ______ &nbsp;&nbsp; Signature : __________________</div>`}
const paperEl=document.getElementById("paper");
</script></body></html>
