<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contrôle SAV</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10253b;background:#f3f6f9}
*{box-sizing:border-box}body{margin:0}.app{max-width:820px;margin:auto;padding:18px}
.head{background:#123b59;color:#fff;padding:22px;border-radius:18px;margin-bottom:16px}
.head h1{margin:0;font-size:25px}.head p{margin:6px 0 0;opacity:.82}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccd5dd;border-radius:10px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:11px;padding:14px 16px;font-weight:750;font-size:16px;cursor:pointer}
.primary{background:#0876d1;color:#fff}.secondary{background:#eaf2f8;color:#123b59}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sectionTitle{font-size:19px;margin:4px 0 12px}
.item{border:1px solid #dde5eb;border-radius:13px;padding:14px;margin:10px 0}
.item b{display:block;margin-bottom:10px}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.state{padding:10px 4px;border:1px solid #ccd5dd;border-radius:8px;background:#fff;font-size:12px}
.state.active.ok{background:#168a50;color:#fff}.state.active.watch{background:#e4a51c;color:#fff}
.state.active.bad{background:#d43c32;color:#fff}.state.active.na{background:#65717b;color:#fff}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.progress{height:8px;background:#e6edf2;border-radius:8px;overflow:hidden}.bar{height:100%;background:#168a50;width:0}
.hidden{display:none}.printSheet{display:none}
@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}.states{grid-template-columns:1fr 1fr}}
@media print{
 body{background:#fff}.app>*{display:none!important}.printSheet{display:block!important;color:#111}
 .printSheet h1{text-align:center;font-size:20px}.printSheet h2{background:#183d56;color:#fff;padding:7px;font-size:14px}
 table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #777;padding:5px}th{background:#e9eef2}
 .checks{text-align:center;width:34px}.sign{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
}
</style>
</head>
<body>
<main class="app">
<div class="head"><h1>🔧 Contrôle SAV Atelier</h1><p>Checklist intelligente • Smartphone & papier</p></div>

<section id="setup" class="card">
<h2 class="sectionTitle">Nouvelle machine</h2>
<label>Client</label><input id="client" placeholder="Nom du client">
<div class="grid">
<div><label>Gamme</label><select id="gamme"><option>Micron</option><option>Micron+</option><option>B4</option><option>StarBi</option></select></div>
<div><label>Technologie</label><select id="tech"><option value="piston">Piston</option><option value="engrenage">Engrenage</option></select></div>
</div>
<div class="grid">
<div><label>Type / capacité du bac</label><select id="bac"><option>5 L</option><option>10 L</option><option>20 L</option><option>Autre</option></select></div>
<div><label>N° de série</label><input id="serial" placeholder="N° série"></div>
</div>
<label>Motif du retour</label><textarea id="motif" rows="2"></textarea>
<button class="btn primary" style="width:100%;margin-top:16px" onclick="generate()">Générer la checklist</button>
</section>

<section id="check" class="hidden">
<div class="card"><b id="machineTitle"></b><p id="count"></p><div class="progress"><div class="bar" id="bar"></div></div></div>
<div id="list"></div>
<div class="card actions">
<button class="btn secondary" onclick="window.print()">🖨️ Imprimer la fiche</button>
<button class="btn primary" onclick="location.reload()">＋ Nouvelle machine</button>
</div>
</section>

<section id="print" class="printSheet"></section>
</main>

<script>
const common=[
["Contrôle général","État général de la machine"],["Contrôle général","Propreté"],["Contrôle général","Carter / capot"],["Contrôle général","Connectiques"],["Contrôle général","Présence accessoires"],
["Bac à colle","État du bac"],["Bac à colle","Propreté intérieure"],["Bac à colle","Isolation"],["Bac à colle","Vidange"],
["Électrique","Carte de contrôle"],["Électrique","Carte puissance"],["Électrique","Sondes de température"],["Électrique","Fusibles"],["Électrique","Connecteurs"],
["Applicateur / tuyaux","État applicateur"],["Applicateur / tuyaux","État tuyaux"],["Applicateur / tuyaux","État pistolet"],["Applicateur / tuyaux","Déclenchement électrovanne"],
["Tests finaux","Mise en chauffe complète"],["Tests finaux","Stabilité température"],["Tests finaux","Absence de fuite"],["Tests finaux","Absence d'alarme"],["Tests finaux","Test sous pression"],["Tests finaux","Cycle complet"]
];
const piston=[["Système piston","Vérin"],["Système piston","Électrovanne"],["Système piston","Vanne de dépressurisation"],["Système piston","Détendeur / manomètre"],["Système piston","Axe de pompe"],["Système piston","Joint piston"],["Système piston","Feeder"]];
const gear=[["Système engrenage","Moteur"],["Système engrenage","Accouplement"],["Système engrenage","Pompe engrenage"],["Système engrenage","Bypass"],["Système engrenage","Étanchéité pompe"]];
let points=[],states={};
const $=s=>document.querySelector(s);
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function generate(){
 points=[...common,...($('#tech').value==='piston'?piston:gear)];states={};
 $('#setup').classList.add('hidden');$('#check').classList.remove('hidden');
 $('#machineTitle').textContent=$('#gamme').value+' • '+$('#tech').selectedOptions[0].text+' • '+$('#bac').value;render();
}
function render(){
 let groups={};points.forEach((p,i)=>(groups[p[0]]??=[]).push([p[1],i]));
 $('#list').innerHTML=Object.entries(groups).map(([g,arr])=>'<div class="card"><h2 class="sectionTitle">'+g+'</h2>'+
 arr.map(([n,i])=>'<div class="item"><b>'+(i+1)+'. '+n+'</b><div class="states">'+
 [['ok','Bon état'],['watch','À surveiller'],['bad','À remplacer'],['na','N/A']].map(x=>'<button class="state '+x[0]+'" onclick="setState('+i+',\\''+x[0]+'\\',this)">'+x[1]+'</button>').join('')+
 '</div><div class="meta"><input placeholder="Valeur relevée"><input placeholder="Commentaire"></div></div>').join('')+'</div>').join('');
 update();
}
function setState(i,s,b){states[i]=s;b.parentElement.querySelectorAll('.state').forEach(x=>x.classList.remove('active'));b.classList.add('active');update()}
function update(){let n=Object.keys(states).length;$('#count').textContent=n+' / '+points.length+' points renseignés';$('#bar').style.width=(100*n/points.length)+'%';buildPrint()}
function buildPrint(){
 let rows=points.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(p[1])+'</td><td class="checks">☐</td><td class="checks">☐</td><td class="checks">☐</td><td class="checks">☐</td><td></td><td></td></tr>').join('');
 let final=points.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(p[1])+'</td><td>À définir</td><td></td><td class="checks">☐</td><td class="checks">☐</td><td></td></tr>').join('');
 $('#print').innerHTML='<h1>'+esc($('#gamme').value)+' - '+esc($('#tech').selectedOptions[0].text)+' - '+esc($('#bac').value)+'<br>FICHE DE CONTRÔLE SAV</h1>'+
 '<p><b>Client :</b> '+esc($('#client').value)+' &nbsp; <b>N° série :</b> '+esc($('#serial').value)+'<br><b>Motif :</b> '+esc($('#motif').value)+'</p>'+
 '<h2>A — DIAGNOSTIC À RÉCEPTION</h2><table><tr><th>N°</th><th>Point de contrôle</th><th>OK</th><th>À surveiller</th><th>À remplacer</th><th>N/A</th><th>Valeur</th><th>Commentaire</th></tr>'+rows+'</table>'+
 '<h2>B — CONTRÔLE FINAL AVANT EXPÉDITION</h2><table><tr><th>N°</th><th>Test</th><th>Consigne</th><th>Valeur mesurée</th><th>OK</th><th>NOK</th><th>Commentaire</th></tr>'+final+'</table>'+
 '<div class="sign"><div><b>Validation :</b><br>☐ Machine nettoyée<br>☐ Aucun défaut actif<br>☐ Test chauffe réalisé<br>☐ Test sous pression réalisé<br>☐ Absence de fuite</div>'+
 '<div><b>Technicien :</b> __________________<br><br><b>Date :</b> ____ / ____ / ______<br><br><b>Signature :</b> __________________</div></div>';
}
</script>
</body></html>
